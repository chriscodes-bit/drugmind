<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drugmind - Stock Tracker</title>

    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="style.css">

</head>

<body>
    <h1>Drugmind</h1>

    <h2>Add Medication</h2>

    <form id="medication-form">

        <div id="medication-details">

            <input id="medication-name" type="text" required placeholder="Name">

            <input id="medication-mg" type="number" required placeholder="Dose">

            <select id="medication-unit" required>
                <option value="µg">µg</option>
                <option value="mg" selected>mg</option>
                <option value="g">g</option>
                <option value="ml">ml</option>
            </select>

        </div>

        <div>
            <label for="pills-remaining">
                Pills in stock
            </label>
            <input id="pills-remaining" type="number" min="0" step="1" required placeholder="50">
        </div>

        <div>
            <label for="pills-per-day">
                Pills per day
            </label>
            <input id="pills-per-day" type="number" min="0.01" step="0.01" required placeholder="1">
        </div>

        <button type="submit">
            Add Medication
        </button>

    </form>

    <h2>Inventory</h2>

    <div id="medications"></div>

    <button onclick="openDoctolib()">
        Open Doctolib
    </button>

    <script>
        function openDoctolib() {
            const appUrl = "doctolib://";
            const webUrl = "https://www.doctolib.de/";

            window.location.href = appUrl;

            setTimeout(() => {
                window.location.href = webUrl;
            }, 1000);
        }
    </script>

    <button id="enable-notifications">
        Enable Notifications
    </button>

    <script src="app.js" defer></script>

</body>

</html>
