<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drugmind - Stock Tracker</title>

    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="style.css">

</head>

<body>
    <h1>Drugmind</h1>

    <button id="enable-notifications">
        Enable Notifications
    </button>

    <h2>Add Medication</h2>

    <form id="medication-form">
        <div>
            <label for="medication-name">
                Name
            </label>

            <input id="medication-name" type="text" required placeholder="Ibuprofen">
        </div>

        <div>
            <label for="pills-remaining">
                Pills in stock
            </label>

            <input id="pills-remaining" type="number" min="0" step="1" required placeholder="50">
        </div>

        <div>
            <label for="pills-per-day">
                Pills per day
            </label>

            <input id="pills-per-day" type="number" min="0.01" step="0.01" required placeholder="1">
        </div>

        <button type="submit">
            Add Medication
        </button>
    </form>

    <h2>Inventory</h2>

    <div id="medications"></div>

    <script src="app.js" defer></script>

</body>

</html>
